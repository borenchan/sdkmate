name: Release sdkmate

# 开发流程：只改根 Cargo.toml 的 [workspace.package] version 一行 → push 到 master
# → tag job 按版本号打 tag → build job 跨平台构建 → upload-release 发版（自动 changelog）
# 注意：用默认 GITHUB_TOKEN 推 tag 不会触发其他 workflow run（GitHub 防递归限制），
# 故 build/release 设计为同一 run 内 tag 的后续 job，而非依赖 tag-push 事件。
on:
  push:
    branches:
      - master

jobs:
  # ── 1. 按 Cargo.toml 版本号打 tag（若该 tag 尚不存在）────────────
  tag:
    name: Tag version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.maybe_tag.outputs.version }}
      tag_created: ${{ steps.maybe_tag.outputs.tag_created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag if not exists
        id: maybe_tag
        run: |
          set -e
          # 读取 [workspace.package] version（文件首处出现的 version 行）
          VERSION=$(grep -m1 '^version = "' Cargo.toml | cut -d'"' -f2)
          echo "Detected version: ${VERSION}"
          if [ -z "$VERSION" ]; then
            echo "::error::No version found in Cargo.toml"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists, skipping build/release"
            echo "tag_created=false" >> "$GITHUB_OUTPUT"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
            echo "Created and pushed tag v${VERSION}"
            echo "tag_created=true" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. 跨平台构建（仅在新 tag 创建时跑）─────────────────────────
  build:
    name: Build (${{ matrix.asset_name }})
    needs: tag
    if: needs.tag.outputs.tag_created == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sdkm
            asset_name: sdkmate-linux-x86_64
            archive_format: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: sdkm
            asset_name: sdkmate-macos-aarch64
            archive_format: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sdkm.exe
            asset_name: sdkmate-windows-x86_64
            archive_format: zip

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Strip binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" dist/
          if [ "${{ matrix.archive_format }}" = "tar.gz" ]; then
            tar -czf "dist/${{ matrix.asset_name }}.tar.gz" -C dist "${{ matrix.artifact_name }}"
          else
            7z a -tzip "dist/${{ matrix.asset_name }}.zip" "dist/${{ matrix.artifact_name }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # ── 3. 上传产物到 GitHub Release（自动生成 changelog 正文）──────
  upload-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.tag.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip

name: Release sdkmate

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  # ── 1. PR 合并后打 tag（release），同时维护下一个 Release PR（release-pr）
  release-plz-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Tag release
        id: release
        uses: release-plz/action@v0.5
        with:
          command: release        # 打 tag，创建 GitHub Release
          config: .github/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-plz-pr:
    runs-on: ubuntu-latest
    needs: release-plz-release   # release 跑完再开 PR，避免竞态
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Update Release PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr     # 维护下一个版本的 Release PR
          config: .github/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. 跨平台构建：tag 创建后触发 ──────────────────────────────
  build:
    name: Build (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sdkm
            asset_name: sdkmate-linux-x86_64
            archive_format: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: sdkm
            asset_name: sdkmate-macos-aarch64
            archive_format: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sdkm.exe
            asset_name: sdkmate-windows-x86_64
            archive_format: zip

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Strip binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" dist/
          if [ "${{ matrix.archive_format }}" = "tar.gz" ]; then
            tar -czf "dist/${{ matrix.asset_name }}.tar.gz" -C dist "${{ matrix.artifact_name }}"
          else
            7z a -tzip "dist/${{ matrix.asset_name }}.zip" "dist/${{ matrix.artifact_name }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # ── 3. 上传产物到 GitHub Release ───────────────────────────────
  upload-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.zip
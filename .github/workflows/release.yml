name: Release sdkmate

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  # ── 1. master 推送时，按 Cargo.toml 中的版本号自动打 tag（若该 tag 尚不存在）
  #     开发流程：只改根 Cargo.toml 的 [workspace.package] version 一行 → push → 自动 tag → 触发构建+发布
  tag:
    name: Tag version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag if not exists
        run: |
          # 读取 [workspace.package] version（文件首处出现的 version 行）
          VERSION=$(grep -m1 '^version = "' Cargo.toml | cut -d'"' -f2)
          echo "Detected version: ${VERSION}"
          if [ -z "$VERSION" ]; then
            echo "::error::No version found in Cargo.toml"
            exit 1
          fi
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists, skipping"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
            echo "Created and pushed tag v${VERSION}"
          fi

  # ── 2. 跨平台构建：tag 创建后触发 ──────────────────────────────
  build:
    name: Build (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sdkm
            asset_name: sdkmate-linux-x86_64
            archive_format: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: sdkm
            asset_name: sdkmate-macos-aarch64
            archive_format: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sdkm.exe
            asset_name: sdkmate-windows-x86_64
            archive_format: zip

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Strip binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" dist/
          if [ "${{ matrix.archive_format }}" = "tar.gz" ]; then
            tar -czf "dist/${{ matrix.asset_name }}.tar.gz" -C dist "${{ matrix.artifact_name }}"
          else
            7z a -tzip "dist/${{ matrix.asset_name }}.zip" "dist/${{ matrix.artifact_name }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # ── 3. 上传产物到 GitHub Release（自动生成 changelog 正文）──────
  upload-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip

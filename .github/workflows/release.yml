name: Release sdkmate

# 开发流程：只改根 Cargo.toml 的 [workspace.package] version 一行 → push 到 master
# → tag job 按版本号打 tag → build job 跨平台构建 → upload-release 发版（自动 changelog）
# 注意：用默认 GITHUB_TOKEN 推 tag 不会触发其他 workflow run（GitHub 防递归限制），
# 故 build/release 设计为同一 run 内 tag 的后续 job，而非依赖 tag-push 事件。
on:
  push:
    branches:
      - master

jobs:
  # ── 1. 按 Cargo.toml 版本号打 tag（若该 tag 尚不存在）────────────
  tag:
    name: Tag version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.maybe_tag.outputs.version }}
      tag_created: ${{ steps.maybe_tag.outputs.tag_created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag if not exists
        id: maybe_tag
        run: |
          set -e
          # 读取 [workspace.package] version（文件首处出现的 version 行）
          VERSION=$(grep -m1 '^version = "' Cargo.toml | cut -d'"' -f2)
          echo "Detected version: ${VERSION}"
          if [ -z "$VERSION" ]; then
            echo "::error::No version found in Cargo.toml"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists, skipping build/release"
            echo "tag_created=false" >> "$GITHUB_OUTPUT"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
            echo "Created and pushed tag v${VERSION}"
            echo "tag_created=true" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. 跨平台构建（仅在新 tag 创建时跑）─────────────────────────
  build:
    name: Build (${{ matrix.asset_name }})
    needs: tag
    if: needs.tag.outputs.tag_created == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux gnu：glibc 2.35（ubuntu-22.04 编译），兼容 Ubuntu 22.04+/Debian 12+/Fedora 37+
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: sdkm
            asset_name: sdkmate-linux-x86_64-gnu
            archive_format: tar.gz
          # Linux musl：全静态，无 glibc 依赖，任意 Linux 通吃（Alpine/CentOS 7/容器）
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            artifact_name: sdkm
            asset_name: sdkmate-linux-x86_64-musl
            archive_format: tar.gz
            apt_packages: musl-tools cmake perl
          # macOS ARM（M1+）：deployment target 11.0 覆盖 Big Sur+，避免绑 runner SDK 版本
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: sdkm
            asset_name: sdkmate-macos-aarch64
            archive_format: tar.gz
            macos_deployment_target: "11.0"
          # macOS Intel：覆盖 x86_64 Mac
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: sdkm
            asset_name: sdkmate-macos-x86_64
            archive_format: tar.gz
            macos_deployment_target: "11.0"
          # Windows：向后兼容性好，保持 latest
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sdkm.exe
            asset_name: sdkmate-windows-x86_64
            archive_format: zip

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install native build deps (Linux musl)
        if: matrix.apt_packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_packages }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          # macOS：固定最低部署版本，避免编出的二进制绑 runner SDK 版本（老 macOS 跑不了，同 glibc 坑）
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Strip binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Package
        shell: bash
        run: |
          # 压缩包内用 .sdkm/ 目录包裹二进制：解压后得 .sdkm/sdkm，
          # sdkm 的 home = 可执行文件父目录（.sdkm），init 直接在里头建 store/ 即可工作
          mkdir -p dist .sdkm
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" .sdkm/
          if [ "${{ matrix.archive_format }}" = "tar.gz" ]; then
            tar -czf "dist/${{ matrix.asset_name }}.tar.gz" .sdkm
          else
            7z a -tzip "dist/${{ matrix.asset_name }}.zip" .sdkm
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # ── 3. 上传产物到 GitHub Release（自动生成 changelog 正文）──────
  upload-release:
    # 需直接列出 tag 才能读到 needs.tag.outputs.version（needs 上下文只含直接依赖）
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          bash .github/scripts/gen_changelog.sh > changelog.md
          echo "===== generated changelog ====="
          cat changelog.md

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Clear existing release (support re-releasing the same version)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          # softprops 不覆盖已存在 release 的 body（只重传 assets）；
          # 重发同一版本时先清掉旧 release，让 softprops 重新创建以写入新 body
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Found existing release v${VERSION}, deleting for a clean re-create"
            gh release delete "v${VERSION}" --yes
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.tag.outputs.version }}
          body_path: changelog.md
          files: |
            dist/*.tar.gz
            dist/*.zip

      - name: Append to root CHANGELOG.md and commit back
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          # 版本块：版本头 + changelog 正文（去掉 gen_changelog 输出的 "## 🚀 What Changed" 标题行，保留 ### 分组）
          {
            echo "## v${VERSION} - ${DATE}"
            echo ""
            tail -n +2 changelog.md
            echo ""
          } > /tmp/block.md

          # 合并到 CHANGELOG.md：保留 "# Changelog" 标题，新版本块插在标题后（最新在上），旧内容跟后
          {
            if [ -f CHANGELOG.md ]; then
              head -n 1 CHANGELOG.md
              echo ""
              cat /tmp/block.md
              echo ""
              tail -n +2 CHANGELOG.md
            else
              echo "# Changelog"
              echo ""
              cat /tmp/block.md
            fi
          } > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

          # commit 回 master（GITHUB_TOKEN push 不触发 workflow 递归，与 tag push 同理）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): update for v${VERSION}"
          git push

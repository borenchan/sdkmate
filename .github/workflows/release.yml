name: Release sdkmate

# 开发流程：只改根 Cargo.toml 的 [workspace.package] version 一行 → push 到 master
# → tag job 按版本号打 tag → build job 跨平台构建 → upload-release 发版（自动 changelog）
# 注意：用默认 GITHUB_TOKEN 推 tag 不会触发其他 workflow run（GitHub 防递归限制），
# 故 build/release 设计为同一 run 内 tag 的后续 job，而非依赖 tag-push 事件。
on:
  push:
    branches:
      - master

jobs:
  # ── 1. 按 Cargo.toml 版本号打 tag（若该 tag 尚不存在）────────────
  tag:
    name: Tag version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.maybe_tag.outputs.version }}
      tag_created: ${{ steps.maybe_tag.outputs.tag_created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag if not exists
        id: maybe_tag
        run: |
          set -e
          # 读取 [workspace.package] version（文件首处出现的 version 行）
          VERSION=$(grep -m1 '^version = "' Cargo.toml | cut -d'"' -f2)
          echo "Detected version: ${VERSION}"
          if [ -z "$VERSION" ]; then
            echo "::error::No version found in Cargo.toml"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists, skipping build/release"
            echo "tag_created=false" >> "$GITHUB_OUTPUT"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
            echo "Created and pushed tag v${VERSION}"
            echo "tag_created=true" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. 跨平台构建（仅在新 tag 创建时跑）─────────────────────────
  # 单个 matrix 同时产出 CLI 包和（可选）Desktop 组合包：
  # 每个 target 只编译一次 CLI；desktop=true 的 target 再编译 GUI 并额外打包，
  # 避免旧方案中 build + build-desktop 两个 job 对同一 target 重复编译 CLI。
  build:
    name: Build (${{ matrix.asset_name }})
    needs: tag
    if: needs.tag.outputs.tag_created == 'true'
    runs-on: ${{ matrix.os }}
    # Linux 跑 ubuntu:22.04 容器锁 glibc 2.35；macOS/Windows 条目无 container 字段
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux gnu：容器 ubuntu:22.04 锁 glibc 2.35；desktop=true 额外编译 GUI
          - os: ubuntu-24.04
            container: ubuntu:22.04
            target: x86_64-unknown-linux-gnu
            bin_cli: sdkm
            bin_gui: sdkm-gui
            asset_name: sdkm-linux-x86_64-gnu
            desktop: true
            desktop_asset_name: sdkm-desktop-linux-x86_64-gnu
            archive_format: tar.gz
            apt_packages: >-
              git curl ca-certificates build-essential cmake perl clang libclang-dev
              pkg-config libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
              libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
              libfontconfig1-dev libfreetype6-dev libglib2.0-dev libasound2-dev libvulkan-dev
          # Linux musl：全静态；GUI 依赖 X11/Wayland，不提供 desktop 包
          - os: ubuntu-24.04
            container: ubuntu:22.04
            target: x86_64-unknown-linux-musl
            bin_cli: sdkm
            asset_name: sdkm-linux-x86_64-musl
            desktop: false
            archive_format: tar.gz
            apt_packages: git curl ca-certificates build-essential cmake perl clang libclang-dev musl-tools
          # Linux ARM64 gnu：原生 arm64 runner + 同款 22.04 容器
          - os: ubuntu-24.04-arm
            container: ubuntu:22.04
            target: aarch64-unknown-linux-gnu
            bin_cli: sdkm
            bin_gui: sdkm-gui
            asset_name: sdkm-linux-aarch64-gnu
            desktop: true
            desktop_asset_name: sdkm-desktop-linux-aarch64-gnu
            archive_format: tar.gz
            apt_packages: >-
              git curl ca-certificates build-essential cmake perl clang libclang-dev
              pkg-config libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
              libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
              libfontconfig1-dev libfreetype6-dev libglib2.0-dev libasound2-dev libvulkan-dev
          # Linux ARM64 musl：树莓派/ARM 服务器/Alpine 通吃
          - os: ubuntu-24.04-arm
            container: ubuntu:22.04
            target: aarch64-unknown-linux-musl
            bin_cli: sdkm
            asset_name: sdkm-linux-aarch64-musl
            desktop: false
            archive_format: tar.gz
            apt_packages: git curl ca-certificates build-essential cmake perl clang libclang-dev musl-tools
          # macOS ARM（M1+）：deployment target 11.0 覆盖 Big Sur+
          - os: macos-15
            target: aarch64-apple-darwin
            bin_cli: sdkm
            bin_gui: sdkm-gui
            asset_name: sdkm-macos-aarch64
            desktop: true
            desktop_asset_name: sdkm-desktop-macos-aarch64
            archive_format: tar.gz
            macos_deployment_target: "11.0"
          # macOS Intel：在 ARM runner 上交叉编译 x86_64
          - os: macos-15
            target: x86_64-apple-darwin
            bin_cli: sdkm
            bin_gui: sdkm-gui
            asset_name: sdkm-macos-x86_64
            desktop: true
            desktop_asset_name: sdkm-desktop-macos-x86_64
            archive_format: tar.gz
            macos_deployment_target: "11.0"
          # Windows：desktop=true，GUI 与 CLI 同目录打包
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_cli: sdkm.exe
            bin_gui: sdkm-gui.exe
            asset_name: sdkm-windows-x86_64
            desktop: true
            desktop_asset_name: sdkm-desktop-windows-x86_64
            archive_format: zip

    steps:
      # 装依赖必须先于 checkout：ubuntu:22.04 裸容器无 git（checkout 需要），
      # 且容器内为 root 无 sudo；macOS/Windows 无 apt_packages 直接跳过
      - name: Install build deps (Linux containers)
        if: matrix.apt_packages
        run: apt-get update && apt-get install -y ${{ matrix.apt_packages }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          # 显式 1.98 与 rust-toolchain.toml 一致（GUI 依赖 stable 1.97+）
          toolchain: 1.98
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # 单 job 单 target 一份缓存，CLI/GUI 共享，避免旧方案两个 cache key 不共享
          key: ${{ matrix.target }}-${{ matrix.os }}

      - name: Build CLI
        env:
          # macOS：固定最低部署版本，避免编出的二进制绑 runner SDK 版本
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: cargo build --release --target ${{ matrix.target }} --locked -p sdkm-cli --bin sdkm

      - name: Build GUI
        if: matrix.desktop
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: cargo build --release --target ${{ matrix.target }} --locked -p sdkm-gui

      - name: Strip binaries (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          strip target/${{ matrix.target }}/release/${{ matrix.bin_cli }}
          if [ "${{ matrix.desktop }}" = "true" ]; then
            strip target/${{ matrix.target }}/release/${{ matrix.bin_gui }}
          fi

      - name: Package CLI
        shell: bash
        run: |
          # 压缩包内用 .sdkm/ 目录包裹二进制：解压后得 .sdkm/sdkm，
          # sdkm 的 home = 可执行文件父目录（.sdkm），init 直接在里头建 store/ 即可工作
          mkdir -p dist .sdkm
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_cli }}" .sdkm/
          if [ "${{ matrix.archive_format }}" = "tar.gz" ]; then
            tar -czf "dist/${{ matrix.asset_name }}.tar.gz" .sdkm
          else
            7z a -tzip "dist/${{ matrix.asset_name }}.zip" .sdkm
          fi

      - name: Package desktop bundle
        if: matrix.desktop
        shell: bash
        run: |
          # CLI 包已在上一步生成；这里把 GUI 与说明文件加入同一个 .sdkm 目录再打包，
          # 保证 desktop 版两个二进制共享 config/store/links
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_gui }}" .sdkm/
          if [ -f README.md ]; then cp README.md .sdkm/; fi
          if [ -f LICENSE ]; then cp LICENSE .sdkm/; fi
          if [ "${{ matrix.archive_format }}" = "tar.gz" ]; then
            tar -czf "dist/${{ matrix.desktop_asset_name }}.tar.gz" .sdkm
          else
            7z a -tzip "dist/${{ matrix.desktop_asset_name }}.zip" .sdkm
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # ── 3. 上传产物到 GitHub Release（自动生成 changelog 正文）──────
  upload-release:
    # 需直接列出 tag 才能读到 needs.tag.outputs.version（needs 上下文只含直接依赖）
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        env:
          VERSION: ${{ needs.tag.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/gen_changelog.sh > changelog.md
          echo "===== generated changelog ====="
          cat changelog.md

      # 中文版 changelog：谷歌翻译免费端点（无需 key），只翻 commit 描述、
      # 分组标题走固定映射；失败/被限流则不产出 changelog.zh.md，发版兜底纯英文
      - name: Translate changelog to Chinese
        run: python3 .github/scripts/translate_changelog_zh.py changelog.md changelog.zh.md

      # 拼双语 body：英文正文 + 折叠的简体中文版；无中文版则直接用英文
      - name: Compose release body
        run: |
          if [ -s changelog.zh.md ]; then
            {
              cat changelog.md
              printf '\n---\n\n<details>\n<summary>🇨🇳 简体中文</summary>\n\n'
              cat changelog.zh.md
              printf '\n</details>\n'
            } > release_body.md
          else
            cp changelog.md release_body.md
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Clear existing release (support re-releasing the same version)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          # softprops 不覆盖已存在 release 的 body（只重传 assets）；
          # 重发同一版本时先清掉旧 release，让 softprops 重新创建以写入新 body
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Found existing release v${VERSION}, deleting for a clean re-create"
            gh release delete "v${VERSION}" --yes
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.tag.outputs.version }}
          body_path: release_body.md
          files: |
            dist/*.tar.gz
            dist/*.zip

      - name: Append to root CHANGELOG.md and commit back
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          # 版本块：版本头 + changelog 正文（去掉 gen_changelog 输出的 "## 🚀 What Changed" 标题行，保留 ### 分组）
          {
            echo "## v${VERSION} - ${DATE}"
            echo ""
            tail -n +2 changelog.md
            echo ""
          } > /tmp/block.md

          # 合并到 CHANGELOG.md：保留 "# Changelog" 标题，新版本块插在标题后（最新在上），旧内容跟后
          {
            if [ -f CHANGELOG.md ]; then
              head -n 1 CHANGELOG.md
              echo ""
              cat /tmp/block.md
              echo ""
              tail -n +2 CHANGELOG.md
            else
              echo "# Changelog"
              echo ""
              cat /tmp/block.md
            fi
          } > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

          # commit 回 master（GITHUB_TOKEN push 不触发 workflow 递归，与 tag push 同理）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): update for v${VERSION}"
          git push

name: Bot smoke test

# GitHub App 机器人冒烟测试（手动触发）：验证 App 身份与安装权限，
# 跑通「建分支 → 提交文件 → 开 PR → 关 PR → 删分支」全链路。
# 通过后 bot 具备自动开 PR 的完整能力；本文件可留作回归或删掉。
on:
  workflow_dispatch:
  # 本文件变更时自动跑一次（改完即时验证，验证通过后此触发器可移除）
  push:
    branches: [master]
    paths: ['.github/workflows/bot-smoke.yml']

permissions: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      # 用 App 私钥换 installation token（bot 身份，1 小时有效）
      - uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Show bot identity
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "bot login: $(gh api user --jq .login)"

      # 全链路：不动 master，只在一次性分支上验证 Contents + Pull requests 权限
      # 失败时把错误写进分支上的 .bot-smoke-error（公开可读，便于无管理员权限时排查）
      - name: Branch and PR round-trip
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # gh api 的 {owner}/{repo} 占位符需要 git 上下文，无 checkout 时不会替换——这里用显式路径
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          error_report() {
            gh api -X PUT "repos/${REPO}/contents/.bot-smoke-error"               -f message="chore: bot smoke error"               -f branch="bot/smoke-test"               -f content="$(printf '%s' "$1" | base64 -w0)" >/dev/null 2>&1 || true
          }
          # 每个 API 调用的 stderr 都被捕获，失败时连同响应体上报
          api() {
            local out
            if ! out=$(gh api "$@" 2>&1); then
              error_report "gh api $* => $out"
              return 1
            fi
            printf '%s' "$out"
          }

          # 幂等：上次异常退出可能残留同分支，先删再建（不存在时报错，忽略）
          gh api -X DELETE "repos/${REPO}/git/refs/heads/bot/smoke-test" >/dev/null 2>&1 || true
          BASE_SHA=$(api "repos/${REPO}/git/ref/heads/master" --jq .object.sha)
          api "repos/${REPO}/git/refs"             -f ref="refs/heads/bot/smoke-test" -f sha="$BASE_SHA" >/dev/null
          # Contents API 建文件必须用 PUT
          api -X PUT "repos/${REPO}/contents/.bot-smoke"             -f message="chore: bot smoke test"             -f branch="bot/smoke-test"             -f content="$(printf ok | base64 -w0)" >/dev/null
          PR=$(api "repos/${REPO}/pulls"             -f title="chore(bot): smoke test (auto-closed)"             -f head="bot/smoke-test"             -f base="master"             -f body="bot 冒烟测试自动创建，验证权限后自动关闭。")
          PR_NUM=$(jq -r .number <<<"$PR")
          echo "PR created: $(jq -r .html_url <<<"$PR")"
          api -X PATCH "repos/${REPO}/pulls/${PR_NUM}" -f state=closed >/dev/null
          api "repos/${REPO}/issues/${PR_NUM}/comments" -f body="smoke test passed" >/dev/null
          api -X DELETE "repos/${REPO}/git/refs/heads/bot/smoke-test" >/dev/null
          echo "round-trip OK"

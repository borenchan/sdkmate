name: 💡 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景 / 想解决的问题
      description: 你遇到了什么不方便？为什么现有命令满足不了？
      placeholder: 我在使用 …… 时遇到 ……，希望 sdkm 能 ……。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案（可选）
      description: 期望的命令行为示例最好附上一句。
      placeholder: 例如 `sdkm xxx`，预期输出 ……
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: 前置确认
      options:
        - label: 我已搜索现有 issue 和 Discussions，确认没有重复建议
          required: true
        - label: 我愿意自己实现这个功能（评论 `/claim` 认领，等待维护者确认后开始）
          required: false

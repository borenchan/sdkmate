name: 💡 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景 / 想解决的问题
      description: 你遇到了什么不方便？为什么现有命令满足不了？
      placeholder: 我在使用 …… 时遇到 ……，希望 sdkm 能 ……。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案（可选）
      description: 期望的命令行为示例最好附上一句。
      placeholder: 例如 `sdkm xxx`，预期输出 ……
    validations:
      required: false

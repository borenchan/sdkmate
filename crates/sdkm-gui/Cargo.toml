[package]
name = "sdkm-gui"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
publish = false

# 独立 GUI 二进制（gpui-kit 桌面前端，复用 sdkcore 业务层）
[dependencies]
gpui-kit = { workspace = true }
# 事件通道 + 后台任务 runtime（worker=2 共享，进程级常驻；core 的 client 缓存依赖它）
tokio = { workspace = true, features = ["rt-multi-thread"] }
sdkm-core = { workspace = true }
sdkm-util = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
# 系统托盘（tray-icon，跨平台；Windows 借 GPUI 主线程消息循环）
tray-icon = { workspace = true }
# PNG → RGBA（窗口图标（非 Windows）与托盘图标解码；gpui 本身已依赖 image 0.25）
image = { workspace = true }

# 首次初始化：管理员检测 + 以管理员身份重启（IsUserAnAdmin/ShellExecuteW）
# windows：现代目录选择器 IFileOpenDialog（资源管理器同款，替代旧版 FolderBrowserDialog）
# raw-window-handle：托盘最小化取主窗口 HWND（gpui 已依赖同版本 0.6）
[target.'cfg(windows)'.dependencies]
raw-window-handle = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_UI_Shell"] }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[lints]
workspace = true

# Windows exe/window 图标嵌入（资源 ID 1，gpui 的 load_icon 从这里读）
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[workspace.package]
version = "0.3.3"
edition = "2024"
license = "Apache-2.0"
authors = ["boren1007@qq.com"]
description = "An SDK version manager for full-stack engineers"
repository = "https://github.com/borenchan/sdkmate"
homepage = "https://github.com/borenchan/sdkmate"

# 工作区成员
[workspace]
members = [
#    ".",           # 根 crate（包含 main.rs）
    "crates/sdkcore",
    "crates/cli",
    "crates/util",
]

# 公共依赖版本管理（统一版本，避免冲突）
[workspace.dependencies]
# CLI 参数解析（derive 派生命令，color 彩色 help/错误）
clap = { version = "4.5.17", features = ["derive","color"] }
# 异步 HTTP 客户端（json/gzip 响应解码；default-tls=Windows schannel 系统库；禁用 http2/charset/stream 省 h2/encoding_rs/futures-util，sdkm 全程 HTTP/1.1 + 下载用 resp.chunk()）
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "gzip",
    "default-tls"
] }
tokio = {version = "1", features = ["fs", "io-util", "rt-multi-thread"]}

# 进度条
indicatif = { version = "0.17" }
# 并行目录遍历（ls 的 size 计算；基于 rayon 工作窃取，传递依赖 rayon/crossbeam，相对 reqwest/rustls 体积可忽略）
jwalk = { version = "0.8" }
# 解压：zip 仅 deflate（禁默认的 zstd/lzma/bzip2/aes 套件）；flate2 解 gzip 流；tar 解归档
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = { version = "1" }
tar = { version = "0.4" }

serde = { version = "1",features = ["derive"]}
serde_json = { version = "1"}
# 终端控制与调色
crossterm = { version = "0.28.1" }
# 配置文件解析
toml = "0.8"
# 错误处理（带 backtrace）
anyhow = { version = "1",features = ["backtrace"] }
# Windows 注册表/消息广播 API
winreg  = {version = "0.52"}
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging"
]}
unicode-width = {version = "0.2"}
url = { version = "2" }
regex-lite = { version = "0.1" }
# 内部 crate 依赖（path-only，无 version 约束；子 crate version.workspace=true 继承，bump 根版本即全工作区升版）
cli = { path = "crates/cli" }
sdkcore = { path = "crates/sdkcore" }
util = { path = "crates/util" }

#根目录 包配置
[package]
name = "sdkmate"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true

### 发布到crate.io的相关配置
publish = false
# 必要信息
readme = "README.md"
keywords = ["sdk", "version-manager", "sdkman","full-stack"]   # 最多 5 个
categories = ["command-line-utilities"]
# 明确排除不需要上传的文件
exclude = [
    ".github/**",
    ".gitignore",
    "*.sh"
]

# 二进制目标配置
[[bin]]
name = "sdkm"
path = "main.rs"

[dependencies]
cli = { workspace = true }
clap = {workspace = true}

# 发布构建体积优化（不影响功能：sdkm 为 IO 密集型 CLI，CPU 计算极少）
[profile.release]
opt-level = 3        # 保持最高优化等级（性能优先）
lto = true           # 跨 crate 链接时优化，去重内联代码
codegen-units = 1    # 单代码生成单元，配合 LTO 最大化去重
panic = "abort"      # 移除 unwind landing pads（项目无 catch_unwind/Drop 终端守卫，无影响）
strip = "symbols"    # 剥离符号信息（PDB 独立保留供调试）

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
authors = ["boren1007@qq.com"]
description = "An SDK version manager for full-stack engineers"
repository = "https://github.com/borenchan/sdkmate"
homepage = "https://github.com/borenchan/sdkmate"

# 工作区成员
[workspace]
members = [
#    ".",           # 根 crate（包含 main.rs）
    "crates/sdkcore",
    "crates/cli",
    "crates/util",
]

# 公共依赖版本管理（统一版本，避免冲突）
[workspace.dependencies]
#cli parser
clap = { version = "4.5.17", features = ["derive","color"] }
#  网络请求
reqwest = { version = "0.12.7", features = [
    "blocking",
    "json",
    "gzip",
    "multipart",
    "stream"
] }
tokio = {version = "1", features = ["fs", "io-util", "rt-multi-thread"]}

# 进度条
indicatif = { version = "0.17" }
# 解压
zip = { version = "2" }
flate2 = { version = "1" }
tar = { version = "0.4" }
futures-util = { version = "0.3" }

serde = { version = "1",features = ["derive"]}
serde_json = { version = "1"}
# 终端控制与调色
crossterm = { version = "0.28.1" }
# 配置文件解析
toml = "0.8"
# 错误处理
anyhow = { version = "1",features = ["backtrace"] }
# win api
winreg  = {version = "0.52"}
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging"
]}
unicode-width = {version = "0.2"}
url = { version = "2" }
regex-lite = { version = "0.1" }
# 内部 crate 依赖（path-only：不发布到 crates.io，无需 version 约束；
# 各 crate 用 workspace=true 继承，bump [workspace.package].version 即全工作区统一升版）
cli = { path = "crates/cli" }
sdkcore = { path = "crates/sdkcore" }
util = { path = "crates/util" }

#根目录 包配置
[package]
name = "sdkmate"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true

### 发布到crate.io的相关配置
publish = false
# 必要信息
readme = "README.md"
keywords = ["sdk", "version-manager", "sdkman","full-stack"]   # 最多 5 个
categories = ["command-line-utilities"]
# 明确排除不需要上传的文件
exclude = [
    ".github/**",
    ".gitignore",
    "*.sh"
]

# 二进制目标配置
[[bin]]
name = "sdkm"
path = "main.rs"

[dependencies]
cli = { workspace = true }
clap = {workspace = true}


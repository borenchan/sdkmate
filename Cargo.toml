[workspace.package]
version = "0.5.6"
edition = "2024"
license = "Apache-2.0"
authors = ["boren1007@qq.com"]
description = "An SDK version manager for full-stack engineers"
repository = "https://github.com/borenchan/sdkmate"
homepage = "https://github.com/borenchan/sdkmate"

# 工作区成员（根为 virtual workspace；默认只构建 CLI，避免日常 cargo build 连带编译 GUI）
[workspace]
# edition 2024 对应 resolver 3；virtual workspace 必须显式声明
resolver = "3"
members = [
    "crates/sdkm-core",
    "crates/sdkm-cli",
    "crates/sdkm-util",
    "crates/sdkm-gui",
]
default-members = ["crates/sdkm-cli"]

# 公共依赖版本管理（统一版本，避免冲突）
[workspace.dependencies]
# CLI 参数解析（derive 派生命令，color 彩色 help/错误）
clap = { version = "4.5.17", features = ["derive","color"] }
# 异步 HTTP 客户端（json/gzip 响应解码；default-tls=Windows schannel 系统库；禁用 http2/charset/stream 省 h2/encoding_rs/futures-util，sdkm 全程 HTTP/1.1 + 下载用 resp.chunk()）
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "gzip",
    "default-tls"
] }
tokio = {version = "1", features = ["fs", "io-util", "rt-multi-thread"]}

# 进度条
indicatif = { version = "0.17" }
# 并行目录遍历（ls 的 size 计算；基于 rayon 工作窃取，传递依赖 rayon/crossbeam，相对 reqwest/rustls 体积可忽略）
jwalk = { version = "0.8" }
# 解压：zip 仅 deflate（禁默认的 zstd/lzma/bzip2/aes 套件）；flate2 解 gzip 流；tar 解归档
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = { version = "1" }
tar = { version = "0.4" }

serde = { version = "1",features = ["derive"]}
serde_json = { version = "1"}
# GUI 框架（gpui 生态全家桶：GPUI + base + component + Lucide 图标，单依赖）
gpui-kit = "0.9"
# 应用/窗口图标解码（PNG → RgbaImage，供 WindowOptions.icon）
image = { version = "0.25", default-features = false, features = ["png"] }
# 终端控制与调色
crossterm = { version = "0.28.1" }
# 配置文件解析
toml = "0.8"
# 错误处理（带 backtrace）
anyhow = { version = "1",features = ["backtrace"] }
# Windows 注册表/消息广播 API
winreg  = {version = "0.56"}
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging"
]}
unicode-width = {version = "0.2"}
url = { version = "2" }
regex-lite = { version = "0.1" }
# 内部 crate 依赖（path-only，无 version 约束；子 crate version.workspace=true 继承，bump 根版本即全工作区升版）
sdkm-core = { path = "crates/sdkm-core" }
sdkm-util = { path = "crates/sdkm-util" }

# 工作区 lint：禁止使用处绝对路径（用 use 导入短名），restriction lint 默认 allow，显式开启
# rustfmt 管不了使用处全路径（imports_granularity 只管 use 聚合且 nightly-only）；clippy absolute_paths 专管此场景
[workspace.lints.clippy]
absolute_paths = "warn"

# 发布构建体积优化（不影响功能：sdkm 为 IO 密集型 CLI，CPU 计算极少）
[profile.release]
opt-level = 3        # 保持最高优化等级（性能优先）
lto = true           # 跨 crate 链接时优化，去重内联代码
codegen-units = 1    # 单代码生成单元，配合 LTO 最大化去重
panic = "abort"      # 移除 unwind landing pads（项目无 catch_unwind/Drop 终端守卫，无影响）
strip = "symbols"    # 剥离符号信息（PDB 独立保留供调试）

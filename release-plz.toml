# release-plz 配置：只发版 sdkmate（root 包），子 crate（cli/sdkcore/util）不单独发版。
# sdkmate 不发布到 crates.io（Cargo.toml publish=false），用 git tag 跟踪已发布版本（git_only），
# 仍自动创建 tag + GitHub Release + 更新 CHANGELOG。push feat/fix 即自动发版。
[[package]]
name = "sdkmate"
git_only = true
publish = false

# 子 crate 是内部库（publish=false、version.workspace），不单独打 tag / 发 Release
[[package]]
name = "cli"
release = false

[[package]]
name = "sdkcore"
release = false

[[package]]
name = "util"
release = false
